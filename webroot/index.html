<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rundvandringar i Skåne</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="gpx.js"></script>
    <script src="/lib/dom.js"></script>
    <script src="/lib/fetch.js"></script>
    <script src="hike_info.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: small;
        }
        #container {
            display: flex;
            flex-direction: row;
            height: 90vh;
        }
        #map {
            flex: 2;
            height: 100%;
        }
        table {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            border-left: 2px solid #ddd;
            border-collapse: collapse;
        }
        #table-container {
            max-height: 100%; /* Set a fixed height for the table container */
            overflow-y: auto; /* Enable vertical scrolling */
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        tr {
            border: 2px solid #ddd;
        }
        .highlight_row {
            background-color: lightcoral;
        }
        .highlight_map {
            border: 2px solid blue;
        }
        .not_visited {
            filter:  hue-rotate(120deg) opacity(60%);
        }

    </style>
</head>
<body onload="setup_map()">
    <div id="links">
    </div>
    <div id="container">
        <div id="map"></div>
        <div id="table-container">
            <table id="track-table">
            </table>
        </div>
    </div>
</html>
